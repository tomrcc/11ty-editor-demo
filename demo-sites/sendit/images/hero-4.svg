<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520">
  <defs>
    <linearGradient id="sbg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="520" rx="16" fill="url(#sbg4)"/>
  <!-- Automation workflow -->
  <!-- Start node -->
  <rect x="310" y="30" width="180" height="50" rx="25" fill="#8b5cf6"/>
  <text x="356" y="60" font-family="sans-serif" font-size="13" font-weight="600" fill="#fff">New Subscriber</text>
  <line x1="400" y1="80" x2="400" y2="110" stroke="#8b5cf6" stroke-width="2"/>
  <polygon points="394,108 406,108 400,116" fill="#8b5cf6"/>
  <!-- Delay node -->
  <rect x="310" y="116" width="180" height="44" rx="10" fill="#fff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="360" y="143" font-family="sans-serif" font-size="12" fill="#7c3aed">Wait 1 day</text>
  <line x1="400" y1="160" x2="400" y2="186" stroke="#8b5cf6" stroke-width="2"/>
  <polygon points="394,184 406,184 400,192" fill="#8b5cf6"/>
  <!-- Email node -->
  <rect x="310" y="192" width="180" height="44" rx="10" fill="#fff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="343" y="219" font-family="sans-serif" font-size="12" fill="#7c3aed">Send Welcome Email</text>
  <line x1="400" y1="236" x2="400" y2="262" stroke="#8b5cf6" stroke-width="2"/>
  <polygon points="394,260 406,260 400,268" fill="#8b5cf6"/>
  <!-- Condition diamond -->
  <polygon points="400,268 460,298 400,328 340,298" fill="#fff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="372" y="302" font-family="sans-serif" font-size="10" fill="#92400e">Opened?</text>
  <!-- Yes branch -->
  <line x1="460" y1="298" x2="560" y2="298" stroke="#34d399" stroke-width="2"/>
  <text x="490" y="292" font-family="sans-serif" font-size="10" fill="#34d399">Yes</text>
  <rect x="560" y="276" width="160" height="44" rx="10" fill="#fff" stroke="#86efac" stroke-width="1.5"/>
  <text x="585" y="303" font-family="sans-serif" font-size="12" fill="#059669">Send Offer Email</text>
  <!-- No branch -->
  <line x1="340" y1="298" x2="240" y2="298" stroke="#ef4444" stroke-width="2"/>
  <text x="260" y="292" font-family="sans-serif" font-size="10" fill="#ef4444">No</text>
  <rect x="80" y="276" width="160" height="44" rx="10" fill="#fff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="107" y="303" font-family="sans-serif" font-size="12" fill="#dc2626">Send Reminder</text>
  <!-- Converge -->
  <line x1="640" y1="320" x2="640" y2="370" stroke="#34d399" stroke-width="2"/>
  <line x1="160" y1="320" x2="160" y2="370" stroke="#ef4444" stroke-width="2"/>
  <line x1="160" y1="370" x2="640" y2="370" stroke="#8b5cf6" stroke-width="2"/>
  <line x1="400" y1="370" x2="400" y2="396" stroke="#8b5cf6" stroke-width="2"/>
  <polygon points="394,394 406,394 400,402" fill="#8b5cf6"/>
  <!-- End node -->
  <rect x="310" y="402" width="180" height="44" rx="10" fill="#fff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="345" y="429" font-family="sans-serif" font-size="12" fill="#7c3aed">Add to Segment</text>
  <line x1="400" y1="446" x2="400" y2="470" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="360" y="470" width="80" height="30" rx="15" fill="#8b5cf6" opacity=".3"/>
  <text x="387" y="490" font-family="sans-serif" font-size="11" fill="#7c3aed">End</text>
</svg>
