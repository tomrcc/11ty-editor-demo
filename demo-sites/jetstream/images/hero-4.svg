<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0c1222"/>
    </linearGradient>
  </defs>
  <rect width="800" height="520" rx="16" fill="url(#bg4)"/>
  <!-- Top nav -->
  <rect x="24" y="24" width="752" height="40" rx="8" fill="#1e3a5f" opacity=".5"/>
  <circle cx="48" cy="44" r="6" fill="#06b6d4"/>
  <rect x="68" y="38" width="60" height="12" rx="4" fill="#334155"/>
  <rect x="680" y="36" width="80" height="16" rx="8" fill="#06b6d4" opacity=".7"/>
  <!-- Cloud infrastructure diagram -->
  <!-- Central node -->
  <rect x="320" y="140" width="160" height="60" rx="12" fill="#0e4a6e" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="364" y="176" font-family="sans-serif" font-size="13" fill="#67e8f9">API Gateway</text>
  <!-- Left nodes -->
  <rect x="60" y="90" width="140" height="50" rx="10" fill="#1e3a5f" opacity=".5" stroke="#3b82f6" stroke-width="1"/>
  <text x="92" y="120" font-family="sans-serif" font-size="11" fill="#93c5fd">Auth Service</text>
  <rect x="60" y="200" width="140" height="50" rx="10" fill="#1e3a5f" opacity=".5" stroke="#3b82f6" stroke-width="1"/>
  <text x="85" y="230" font-family="sans-serif" font-size="11" fill="#93c5fd">User Service</text>
  <!-- Right nodes -->
  <rect x="600" y="90" width="140" height="50" rx="10" fill="#1e3a5f" opacity=".5" stroke="#8b5cf6" stroke-width="1"/>
  <text x="623" y="120" font-family="sans-serif" font-size="11" fill="#c4b5fd">Data Store</text>
  <rect x="600" y="200" width="140" height="50" rx="10" fill="#1e3a5f" opacity=".5" stroke="#8b5cf6" stroke-width="1"/>
  <text x="630" y="230" font-family="sans-serif" font-size="11" fill="#c4b5fd">Cache</text>
  <!-- Connectors -->
  <line x1="200" y1="115" x2="320" y2="160" stroke="#3b82f6" stroke-width="1.5" opacity=".5"/>
  <line x1="200" y1="225" x2="320" y2="180" stroke="#3b82f6" stroke-width="1.5" opacity=".5"/>
  <line x1="480" y1="160" x2="600" y2="115" stroke="#8b5cf6" stroke-width="1.5" opacity=".5"/>
  <line x1="480" y1="180" x2="600" y2="225" stroke="#8b5cf6" stroke-width="1.5" opacity=".5"/>
