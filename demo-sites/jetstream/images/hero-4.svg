  <rect x="24" y="290" width="752" height="206" rx="10" fill="#1e3a5f" opacity=".3"/>
  <text x="44" y="318" font-family="sans-serif" font-size="13" fill="#94a3b8">System Monitoring</text>
  <!-- Sparklines -->
  <rect x="44" y="336" width="220" height="70" rx="8" fill="#0f172a" opacity=".5"/>
  <text x="58" y="356" font-family="sans-serif" font-size="10" fill="#64748b">CPU Usage</text>
  <polyline points="58,390 80,380 100,385 120,370 140,375 160,365 180,372 200,360 220,355 240,362" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
  <rect x="290" y="336" width="220" height="70" rx="8" fill="#0f172a" opacity=".5"/>
  <text x="304" y="356" font-family="sans-serif" font-size="10" fill="#64748b">Memory</text>
  <polyline points="304,390 326,385 346,380 366,382 386,375 406,370 426,372 446,368 466,365 486,362" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
  <rect x="536" y="336" width="220" height="70" rx="8" fill="#0f172a" opacity=".5"/>
  <text x="550" y="356" font-family="sans-serif" font-size="10" fill="#64748b">Network I/O</text>
  <polyline points="550,385 572,375 592,388 612,370 632,380 652,365 672,375 692,360 712,370 732,358" fill="none" stroke="#f472b6" stroke-width="2" stroke-linecap="round"/>
